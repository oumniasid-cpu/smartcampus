name: smartcampus
description: "A comprehensive Flutter project for Smart Campus management."
publish_to: 'none'

version: 1.0.0+1

environment:
  # Updated to match your Dart 3.11.5 environment
  sdk: '>=3.11.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  cupertino_icons: ^1.0.8

  # Navigation & State Management
  go_router: ^14.0.0
  flutter_bloc: ^8.1.6
  equatable: ^2.0.7
  get_it: ^8.0.0
  injectable: ^2.5.0 # Required for your configureDependencies() call

  # Network & Data
  dio: ^5.5.0
  connectivity_plus: ^6.1.0
  shared_preferences: ^2.3.0
  flutter_secure_storage: ^9.2.0
  sqflite: ^2.4.0
  path: ^1.9.1

  # Device Features
  local_auth: ^2.3.0
  geolocator: ^13.0.0
  image_picker: ^1.1.0
  permission_handler: ^11.3.1
  flutter_local_notifications: ^18.0.0
  sensors_plus: ^6.0.0

  # Firebase — Standardized stable versions for Dart 3.x
  firebase_core: ^3.10.1
  firebase_auth: ^5.4.1
  cloud_firestore: ^5.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  
  # Generators for Dependency Injection (Injection.config.dart)
  build_runner: ^2.4.13
  injectable_generator: ^2.6.2

flutter:
  uses-material-design: true
  generate: true