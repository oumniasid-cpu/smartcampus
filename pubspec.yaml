name: smartcampus
description: "A comprehensive Flutter project for Smart Campus management."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:       # ← une seule fois ici
    sdk: flutter
  intl: ^0.20.2                # ← une seule fois ici

  cupertino_icons: ^1.0.8

  # Navigation & State Management
  go_router: ^14.0.0
  flutter_bloc: ^8.1.6
  equatable: ^2.0.7
  get_it: ^8.0.0

  # Network & Data
  dio: ^5.5.0
  connectivity_plus: ^6.1.0
  shared_preferences: ^2.3.0
  flutter_secure_storage: ^9.2.0
  sqflite: ^2.4.0
  path: ^1.9.1

  # Device Features
  local_auth: ^2.3.0
  geolocator: ^13.0.0
  image_picker: ^1.1.0
  permission_handler: ^11.3.1
  flutter_local_notifications: ^18.0.0
  sensors_plus: ^6.0.0

  # Firebase — versions compatibles entre elles
  firebase_core: ^4.7.0
  firebase_auth: ^6.4.0
  cloud_firestore: ^6.3.0
  flutter_gen: ^5.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true
